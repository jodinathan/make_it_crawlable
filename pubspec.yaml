name: make_it_crawlable
description: >-
  SEO for Flutter Web: real HTML pages built on your app's index.html, plus
  sitemap.xml and robots.txt. The same response for people and bots.
version: 0.1.0
repository: https://github.com/jodinathan/make_it_crawlable
issue_tracker: https://github.com/jodinathan/make_it_crawlable/issues
topics:
  - seo
  - sitemap
  - shelf
  - flutter
  - web

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.6
  html: ^0.15.6
  http: ^1.4.0
  logging: ^1.3.0
  shelf: ^1.4.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
